{% extends "fantasy/base.html" %}

{% block titulo %}Unirse a un grupo · Fantasy Ligas Vascas{% endblock %}

{% block content %}
    <p><a href="{% url 'mis_grupos' %}">Volver a mis grupos</a></p>

    <h1>Unirme a un grupo</h1>
    <p>Escribe el código de 8 caracteres que te ha pasado el creador del grupo.</p>

    <form method="post" class="formulario">
        {% csrf_token %}

        <div class="campo">
            <label for="codigo">Código del grupo</label>
            <input id="codigo" name="codigo" type="text" maxlength="8" required
                   autocomplete="off" autocapitalize="characters" spellcheck="false"
                   class="input-codigo" value="{{ request.POST.codigo }}">
        </div>

        <button type="submit" class="boton">Unirme al grupo</button>
    </form>
{% endblock %}
