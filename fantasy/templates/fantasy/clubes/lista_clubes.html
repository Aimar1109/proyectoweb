{% extends 'fantasy/base.html' %}

{% block title %}Inicio - Fantasy Ligas Vascas{% endblock %}

{% block content %}

    <h1>Lista de clubes</h1>

    {% for club in clubes %}
        <p>
            <a href="{% url 'detalle_club' club.pk %}">
                {{ club.nombre }}
            </a>
        </p>
    {% empty %}
        <p>No hay clubes registrados.</p>
    {% endfor %}

    <p><a href="{% url 'index' %}">Volver al inicio</a></p>
{% endblock %}
